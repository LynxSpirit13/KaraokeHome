name: Build KaraokeHome Android

on:
  push:
    branches: [ "main", "fix/**", "feature/integrated-phone-tv-build" ]
  pull_request:
    branches: [ "main", "feature/integrated-phone-tv-build" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Copy playback assets into Android assets
        run: |
          mkdir -p app/src/main/assets
          cp "reyna se.sf2" app/src/main/assets/reyna-se.sf2
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/radiocanada/RadioCanada%5Bwdth%2Cwght%5D.ttf" --output "app/src/main/assets/RadioCanada[wdth,wght].ttf"
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/radiocanada/OFL.txt" --output "app/src/main/assets/OFL-RadioCanada.txt"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KaraokeHome-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
